name: Mobile CD (production)

# Runs CI, then either publishes an OTA update or starts a new EAS build per platform,
# depending on whether the native fingerprint changed (see mobile/scripts/eas-deploy.mjs).
on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:

concurrency:
  group: mobile-cd-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/mobile-ci.yml

  deploy:
    name: EAS deploy (production)
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build or OTA update
        run: node scripts/eas-deploy.mjs --profile production --platforms "${{ vars.EAS_PLATFORMS_PRODUCTION || 'android' }}"
